name: Verify the published site

# GitHub Pages serves this site from the committed docs/ directory on main, not
# from an Actions artifact. actions/upload-pages-artifact needs Actions artifact
# storage, and this account's storage is blocked by billing, so every upload
# fails with "Artifact storage quota has been hit" after an otherwise green
# build. Serving docs/ straight from the branch needs no artifact storage and no
# hosted runner, so a plain `git push` publishes.
#
# That leaves CI one job: proving the committed docs/ is what the sources
# actually build. Nothing else notices when docs/ goes stale, and a stale docs/
# is a stale site.
#
# GitHub-hosted runners are blocked on this account too, so this runs on the
# sandboxed self-hosted runner from aabiro/xcelsior (scripts/ci-runner/):
#
#     XCELSIOR_CI_REPO=aabiro/aabiro.github.io ./scripts/ci-runner/run-runner.sh
#
# That runner is ephemeral: it serves one job and exits. A push with no runner up
# waits in the queue; the site is already live either way, since Pages publishes
# docs/ without waiting for this.
#
# No pull_request trigger, deliberately. This repository is public, and a
# pull_request trigger on a self-hosted runner lets anyone's pull request run
# code on it. Pushing to main needs write access, which a fork does not have.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: [self-hosted, sandboxed]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site into a scratch directory
        # The resume PDF is not rebuilt here: the runner image has no pandoc and
        # no sudo, so the committed PDF exported from the DOCX template is what
        # ships. scripts/build_resume_pdf.sh is a local step.
        run: SITE_OUTPUT_DIR="$RUNNER_TEMP/site" bash scripts/build_site.sh
      - name: Verify the build output
        run: |
          cd "$RUNNER_TEMP/site"
          test -f index.html
          test -f llms.txt
          test -f .well-known/agent.json
          test -f assets/Aaryn_Biro_Resume.pdf
          test -f favicon.png
          test -f .nojekyll
          grep -q 'application/ld+json' index.html
          grep -q 'og:image' index.html
          grep -q 'id="static-profile"' index.html
          if grep -q 'Unpacking\.\.\.' index.html; then echo "index.html still serves the bare loader"; exit 1; fi
      - name: Committed docs/ matches a fresh build
        run: |
          if ! diff -r "$RUNNER_TEMP/site" docs; then
            echo
            echo "docs/ is stale. GitHub Pages serves it as-is, so rebuild and commit it:"
            echo "    SITE_OUTPUT_DIR=\"\$PWD/docs\" bash scripts/build_site.sh"
            exit 1
          fi
