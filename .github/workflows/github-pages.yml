name: Deploy to GitHub Pages

# GitHub-hosted runners are blocked at the account level, so this runs on the
# sandboxed self-hosted runner from aabiro/xcelsior (scripts/ci-runner/). Start
# it for this repository from the xcelsior checkout:
#
#     XCELSIOR_CI_REPO=aabiro/aabiro.github.io ./scripts/ci-runner/run-runner.sh
#
# That runner is ephemeral: it serves one job and exits, so build and deploy are
# a single job. A push with no runner up waits in the queue until one starts.
#
# No pull_request trigger, deliberately. This repository is public, and a
# pull_request trigger on a self-hosted runner lets anyone's pull request run
# code on it. Pushing to main needs write access, which a fork does not have.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: [self-hosted, sandboxed]
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build resume PDF from RESUME.md
        # The runner image has no pandoc and no sudo, so this keeps the
        # committed PDF exported from the DOCX template.
        run: bash scripts/build_resume_pdf.sh
      - name: Assemble static site (page + SEO assets + resume)
        run: bash scripts/build_site.sh
      - name: Verify site output
        run: |
          test -f site/index.html
          test -f site/llms.txt
          test -f site/.well-known/agent.json
          test -f site/assets/Aaryn_Biro_Resume.pdf
          test -f site/favicon.png
          grep -q 'application/ld+json' site/index.html
          grep -q 'og:image' site/index.html
          grep -q 'id="static-profile"' site/index.html
          if grep -q 'Unpacking\.\.\.' site/index.html; then echo "index.html still serves the bare loader"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
