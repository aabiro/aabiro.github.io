name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Sync agent-readable assets (L6)
        run: bash scripts/sync_agent_assets.sh
      - name: Build resume PDF from RESUME.md
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc wkhtmltopdf || true
          bash scripts/build_resume_pdf.sh
      - run: flutter build web --release --base-href /
      - name: Verify agent assets in build output
        run: |
          test -f build/web/llms.txt
          test -f build/web/.well-known/agent.json
          test -f build/web/assets/assets/Aaryn_Biro_Resume.pdf
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
