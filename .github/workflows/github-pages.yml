name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build resume PDF from RESUME.md
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc wkhtmltopdf || true
          bash scripts/build_resume_pdf.sh
      - name: Assemble static site (page + SEO assets + resume)
        run: bash scripts/build_site.sh
      - name: Verify site output
        run: |
          test -f site/index.html
          test -f site/llms.txt
          test -f site/.well-known/agent.json
          test -f site/assets/Aaryn_Biro_Resume.pdf
          test -f site/favicon.png
          grep -q 'application/ld+json' site/index.html
          grep -q 'og:image' site/index.html
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
