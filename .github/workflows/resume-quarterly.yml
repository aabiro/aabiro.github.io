name: Quarterly resume stats

on:
  schedule:
    # 09:00 UTC on the 1st of Jan, Apr, Jul, Oct
    - cron: "0 9 1 1,4,7,10 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: [self-hosted, sandboxed]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch GitHub contribution stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_github_stats.py
      # The PDF is deliberately not rebuilt here. Its line breaks depend on the
      # fonts of the machine that converts it, so rebuilding on the runner would
      # reflow the page; and the step this replaces ran `apt-get install pandoc`
      # followed by a build that would have overwritten the designed resume with
      # a plain pandoc render of RESUME.md. scripts/check_resume_lock.py fails
      # the next push instead, which is the signal to run
      # scripts/build_resume_pdf.sh locally and commit the refreshed PDF.
      - name: Commit updated resume and stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RESUME.md assets/github_stats.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: quarterly GitHub contribution stats"
            git push
          fi