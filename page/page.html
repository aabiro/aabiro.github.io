    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }

            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

      } catch (err) {

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];

    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }

      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }\n        for (let y = off; y < h; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }\n      }\n      ctx.strokeStyle = 'rgba(15,118,110,0.055)';\n      ctx.lineWidth = 44;\n      ctx.beginPath();\n      ctx.moveTo(w * 0.70, -80);\n      ctx.lineTo(w + 120, h * 0.35);\n      ctx.stroke();\n      if (cursor && this.props.enableCrosshair !== false) {\n        ctx.strokeStyle = 'rgba(15,118,110,0.075)';\n        ctx.lineWidth = 1;\n        ctx.beginPath(); ctx.moveTo(cursor.x, 0); ctx.lineTo(cursor.x, h); ctx.stroke();\n        ctx.beginPath(); ctx.moveTo(0, cursor.y); ctx.lineTo(w, cursor.y); ctx.stroke();\n      }\n    };\n    this._resize = () => {\n      const dpr = window.devicePixelRatio || 1;\n      c.width = window.innerWidth * dpr;\n      c.height = window.innerHeight * dpr;\n      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n      draw();\n    };\n    let rafPending = false;\n    const scheduleDraw = () => {\n      if (rafPending) return;\n      rafPending = true;\n      requestAnimationFrame(() => { rafPending = false; draw(); });\n    };\n    this._onMove = (e) => { cursor = { x: e.clientX, y: e.clientY }; scheduleDraw(); };\n    this._onScroll = () => {\n      const el = document.scrollingElement || document.documentElement;\n      const max = el.scrollHeight - el.clientHeight;\n      scrollProg = max <= 0 ? 0 : Math.min(1, Math.max(0, el.scrollTop / max));\n      if (this._prog) this._prog.style.width = (scrollProg * 100) + '%';\n      if (this._topBtn) {\n        const show = scrollProg > 0.04;\n        this._topBtn.style.opacity = show ? '1' : '0';\n        this._topBtn.style.pointerEvents = show ? 'auto' : 'none';\n      }\n      scheduleDraw();\n    };\n    window.addEventListener('resize', this._resize);\n    window.addEventListener('mousemove', this._onMove);\n    window.addEventListener('scroll', this._onScroll, true);\n    this._resize();\n    this._onScroll  slot = leading;\n    for (const day of days) {\n      wk[slot] = day; slot++;\n      if (slot === 7) { weeksRaw.push(wk); wk = new Array(7).fill(null); slot = 0; }\n    }\n    if (slot > 0) weeksRaw.push(wk);\n    const labels = [];\n    let lastMonth = null, lastLabelWeek = -10;\n    for (let w = 0; w < weeksRaw.length; w++) {\n      const fd = weeksRaw[w].find(d => d);\n      if (!fd) continue;\n      const m = fd.date.getMonth();\n      if (m !== lastMonth) {\n        if (w - lastLabelWeek >= 3) { labels.push({ left: w * 14, text: this.months[m] }); lastLabelWeek = w; }\n        lastMonth = m;\n      }\n    }\n    const weeks = weeksRaw.map(col => col.map(d => {\n      if (!d) return { empty: true, color: 'transparent', title: '' };\n      const label = d.count === 1 ? '1 contribution' : ((d.count === 0 ? 'No' : d.count) + ' contributions');\n      const wd = this.weekdayNames[d.date.getDay()];\n      return { empty: false, color: this.levelColors[d.level],\n        title: label + ' on ' + wd + ', ' + this.months[d.date.getMonth()] + ' ' + d.date.getDate() + ', ' + d.date.getFullYear() };\n    }));\n    return { weeks, monthLabels: labels, gridWidth: weeksRaw.length * 14 - 3 };\n  }\n\n  _scrollTo(label) {\n    const el = document.getElementById('sec-' + label);\n    if (!el) return;\n    const top = el.getBoundingClientRect().top + window.scrollY - 90;\n    this._smoothScrollTo(top, 700);\n  }\n\n  _lockBodyScroll() {\n    if (this._scrollLocked) return;\n    this._scrollLocked = true;\n    this._savedScrollY = window.scrollY;\n    const b = document.body.style;\n    b.position = 'fixed';\n    b.top = (-this._savedScrollY) + 'px';\n    b.left = '0';\n    b.right = '0';\n    b.width = '100%';\n  }\n\n  _unlockBodyScroll() {\n    if (!this._scrollLocked) return;\n    this._scrollLocked = false;\n    const b = document.body.style;\n    b.position = '';\n    b.top = '';\n    b.left = '';\n    b.right = '';\n    b.width = '';\n    window.scrollTo(0, this._savedScrollY || 0);\n  }\n\n  _smoothScrollTo(targetY, duration = 700) {\n    const startY = window.scrollY;\n    const diff = targetY - startY;\n    if (Math.abs(diff) < 1) return;\n    const ease = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);\n    const start = performance.now();\n    const step = (now) => {\n      const t = Math.min(1, (now - start) / duration);\n      window.scrollTo({ top: startY + diff * ease(t), behavior: 'auto' });\n      if (t < 1) requestAnimationFrame(step);\n    };\n    requestAnimationFrame(step);\n  }\n\n  _open(url) { window.open(url, '_blank', 'noopener'); }\n  _email(subject) { window.open('mailto:aaryn.alexander@gmail.com?subject=' + encodeURIComponent(subject), '_self'); }\n  _isMobileBrowser() {\n    const ua = (navigator.userAgent || '').toLowerCase();\n    return /iphone|ipad|ipod|android/.test(ua);\n  }\n  _download() {\n    const staticHref = 'assets/Aaryn_Biro_Resume.pdf';\n    const isMobile = this._isMobileBrowser();\n    // Blob URLs (window.__resources.resumePdf, created by the bundler\n    // runtime) live only in this tab's memory. Opening one with\n    // target=\"_blank\" on mobile Safari/Chrome opens a NEW browsing context\n    // that has no access to that memory, rendering a blank/black page\n    // instead of the native PDF viewer. Always use the real, fetchable\n    // static asset path on mobile; desktop keeps using the in-memory blob\n    // (falling back to the static path) since forced download works either way.\n    const href = isMobile ? staticHref : ((window.__resources && window.__resources.resumePdf) || staticHref);\n    const a = document.createElement('a');\n    a.href = href;\n    a.target = '_blank';\n    a.rel = 'noopener';\n    // Mobile browsers show their own PDF viewer (share, save, print controls)\n    // when a PDF is opened directly instead of forced through a download\n    // attribute, so skip `.download` on phones/tablets.\n    if (!isMobile) a.download = 'Aaryn_Biro_Resume.pdf';\n    document.body.appendChild(a); a.click(); a.remove();\n  }\n\n  renderVals() {\n    const selected = this.capabilities.find(g => g.name === this.state.cap) || this.capabilities[0];\n    const sinceLabel = 'Jun 2025';\n    const githubTitle = this.state.total == null\n      ? 'Contributions since ' + sinceLabel\n      : this.state.total + ' contributions since ' + sinceLabel;\n    return {\n      metrics: this.metrics,\n      caseStudies: this.caseStudies,\n      experience: this.experience.map(e => ({ ...e, heading: e.role + ' / ' + e.company })),\n      skillColumns: this.skillColumns,\n      heroTags: this.heroTags,\n      mapNodes: this.mapNodes.map(n => ({ ...n, left: n.x, top: n.y })),\n      navItems: this.navLabels.map(l => ({ label: l, onClick: () => { this._unlockBodyScroll(); this.setState({ mobileNavOpen: false }); this._scrollTo(l); } })),\n      capabilityTabs: this.capabilities.map(g => {\n        const sel = g.name === this.state.cap;\n        return { name: g.name, onClick: () => this.setState({ cap: g.name }),\n          bg: sel ? '#111312' : '#F1F4EF', fg: sel ? '#ffffff' : '#111312', border: sel ? '#111312' : '#DDE2DC' };\n      }),\n      selectedSummary: selected.summary,\n      selectedItems: selected.items,\n      weeks: this.state.weeks,\n      monthLabels: this.state.monthLabels,\n      gridWidth: this.state.gridWidth,\n      gridWidthPad: this.state.gridWidth + 30,\n      legendColors: this.levelColors,\n      weekdayGutter: [\n        { label:'', h:14 }, { label:'Mon', h:14 }, { label:'', h:14 },\n        { label:'Wed', h:14 }, { label:'', h:14 }, { label:'Fri', h:14 }, { label:'', h:11 },\n      ],\n      githubTitle,\n      githubLoading: this.state.loading,\n      githubFailed: this.state.failed && !this.state.loading,\n      githubReady: !this.state.loading && !this.state.failed,\n      retryGithub: () => { this.setState({ loading: true, failed: false }); this._fetchGithub(); },\n      toTop: () => this._smoothScrollTo(0, 700),
