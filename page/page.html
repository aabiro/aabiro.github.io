document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 display:flex !important; }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<canvas ref=\"{{ bgRef }}\" style=\"position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none;\"><\u002Fcanvas>\n\n<div ref=\"{{ progRef }}\" style=\"position:fixed; top:0; left:0; height:3px; width:0%; background:#0F766E; z-index:60;\"><\u002Fdiv>\n\n<button ref=\"{{ topBtnRef }}\" onclick=\"{{ toTop }}\" class=\"cbtn dc-scrolltop\" style=\"display:none; position:fixed; right:18px; bottom:18px; z-index:55; width:46px; height:46px; border-radius:50%; background:#111312; color:#fff; border:none; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .2s; padding:0;\" style-hover=\"background:#000;\"><span class=\"msi\" style=\"font-size:22px;\">arrow_upward<\u002Fspan><\u002Fbutton>\n\n<nav style=\"position:fixed; top:0; left:0; right:0; height:70px; z-index:50; background:rgba(250,250,248,0.86); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-bottom:1px solid #DDE2DC;\">\n  <div style=\"max-width:1180px; height:100%; margin:0 auto; padding:0 32px; display:flex; align-items:center; gap:18px;\">\n    <button onclick=\"{{ toTop }}\" style=\"display:flex; align-items:center; gap:10px; background:none; border:none; padding:6px 2px; cursor:pointer;\">\n      <span style=\"width:30px; height:30px; display:flex; align-items:center; justify-content:center; background:#111312; border-radius:8px; color:#fff; font-weight:800; font-size:12px;\">AB<\u002Fspan>\n      <span style=\"font-weight:800; color:#111312; font-size:15px;\">Aaryn Biro<\u002Fspan>\n    <\u002Fbutton>\n    <div class=\"dc-nav-links\" style=\"flex:1; display:flex; gap:2px; overflow-x:auto;\">\n      <sc-for list=\"{{ navItems }}\" as=\"item\" hint-placeholder-count=\"6\">\n        <button onclick=\"{{ item.onClick }}\" class=\"cbtn\" style=\"background:none; border:none; color:#111312; padding:8px 10px; font-weight:600;\" style-hover=\"background:#F1F4EF;\">{{ Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"flex:1;\"><\u002Fdiv>\n    <button onclick=\"{{ downloadResume }}\" class=\"cbtn\" style=\"width:100%; justify-content:center; background:#111312; color:#fff; border:1px solid #111312; padding:14px 16px; margin-top:12px;\" style-hover=\"background:#000;\"><span class=\"msi\" style=\"font-size:18px;\">download<\u002Fspan>Download resume<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<main style=\"position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:118px 32px 20px; min-height:100vh; display:flex; flex-direction:column;\">\n\n  <!-- HERO -->\n  <section data-screen-label=\"Hero\" class=\"dc-stack\" style=\"display:flex; gap:54px; align-items:flex-start; flex-wrap:wrap;\">\n    <div style=\"flex:7 1 480px; min-width:300px;\">\n      <div style=\"display:flex; align-items:center; gap:10px; flex-wrap:wrap;\">\n        <span style=\"width:10px; height:10px; border-radius:50%; background:#0F766E;\"><\u002Fspan>\n        <span style=\"color:#0F766E; font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:11px; font-weight:800; letter-spacing:.02em;\">AVAILABLE FOR SELECT BUILDS<\u002Fspan>\n        <span style=\"width:1px; height:18px; background:#DDE2DC;\"><\u002Fspan>\n        <span style=\"color:#626861; font-weight:600; font-size:14px;\">Remote-friendly from Eastern time<\u002Fspan>\n      <\u002Fdiv>\n      <h1 style=\"margin:24px 0 0; font-size:clamp(58px,7.4vw,96px); font-weight:800; line-height:0.96; letter-spacing:-0.01em; color:#111312;\">Aaryn Biro<\u002Fh1>\n      <p style=\"margin:18px 0 0; max-width:760px; font-size:24px; font-weight:700; line-height:1.22; color:#111312;\">Founder and principal engineer building GPU compute platforms, Next.js interfaces, AI media systems, and production-grade experiences.<\u002Fp>\n      <p style=\"margin:18px 0 0; max-width:680px; font-size:18px; line-height:1.65; color:#626861;\">I work across architecture, backend services, mobile apps ; font-size:16px; line-height:1.62; color:#626861;\">Real commit history, pulled live from GitHub. Every square is a day of shipped work since April 2025 across Xcelsior, PixelEnhance, and the systems around them.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"margin-top:24px; background:#fff; border:1px solid #DDE2DC; border-radius:8px; padding:20px;\">\n      <div style=\"display:flex; align-items:flex-start; gap:12px;\">\n        <div style=\"flex:1;\">\n          <span style=\"color:#0F766E; font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:11px; font-weight:800;\">LIVE FROM GITHUB<\u002Fspan>\n          <p style=\"margin:8px 0 0; font-size:16px; font-weight:900; line-height:1.2; color:#111312;\">{{ githubTitle }}<\u002Fp>\n        <\u002Fdiv>\n        <button onclick=\"{{ openGithub }}\" class=\"cbtn\" style=\"background:none; border:none; color:#111312; padding:8px 10px;\" style-hover=\"background:#F1F4EF;\"><span class=\"msi\" style=\"font-size:16px;\">north_east<\u002Fspan>@aabiro<\u002Fbutton>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ githubLoading }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"margin-top:18px; height:118px; border-radius:6px; background:repeating-linear-gradient(90deg,#EBF0EA 0 11px,transparent 11px 14px),repeating-linear-gradient(0deg,#EBF0EA 0 11px,transparent 11px 14px); background-color:#fff; opacity:.7;\"><\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ githubFailed }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:18px;\">\n          <p style=\"font-size:14px; line-height:1.5; color:#626861; margin:0;\">The live contribution feed is unavailable right now.<\u002Fp>\n          <div style=\"margin-top:12px; display:flex; gap:10px; flex-wrap:wrap;\">\n            <button onclick=\"{{ retryGithub }}\" class=\"cbtn\" style=\"background:#fff; color:#111312; border:1px solid #111312; padding:11px 14px;\" style-hover=\"background:#F1F4EF;\"><span class=\"msi\" style=\"font-siz ">Built for moving parts.<\u002Fh2>\n      <p style=\"margin:12px 0 0; font-size:16px; line-height:1.62; color:#626861;\">The common thread is coordination: compute, workers, queues, people, releases, and product surfaces all need to line up.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"dc-stack\" style=\"margin-top:24px; display:flex; gap:18px; align-items:stretch; flex-wrap:wrap;\">\n      <div style=\"flex:6 1 460px; min-width:320px; background:#fff; border:1px solid #DDE2DC; border-radius:8px;\">\n        <div style=\"position:relative; height:370px;\">\n          <svg viewBox=\"0 0 620 370\" preserveAspectRatio=\"none\" style=\"position:absolute; inset:0; width:100%; height:100%;\">\n            <path d=\"M99 81 C204 81 204 81 310 81\" fill=\"none\" stroke=\"rgba(17,19,18,0.18)\" stroke-width=\"1.4\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n            <path d=\"M310 81 C415 81 415 81 521 81\" fill=\"none\" stroke=\"rgba(17,19,18,0.18)\" stroke-width=\"1.4\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n            <path id=\"mp13\" d=\"M310 81 C248 81 248 274 186 274\" fill=\"none\" stroke=\"rgba(17,19,18,0.18)\" stroke-width=\"1.4\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n            <path d=\"M310 81 C365 81 365 274 421 274\" fill=\"none\" stroke=\"rgba(17,19,18,0.18)\" stroke-width=\"1.4\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n            <path d=\"M186 274 C303 274 303 274 421 274\" fill=\"none\" stroke=\"rgba(17,19,18,0.18)\" stroke-width=\"1.4\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n            <circle r=\"4\" fill=\"#0F766E\">\n              <animateMotion dur=\"3.4s\" repeatCount=\"indefinite\" rotate=\"0\"><mpath href=\"#mp13\"><\u002Fmpath><\u002FanimateMotion>\n            <\u002Fcircle>\n          <\u002Fsvg>\n          <sc-for list=\"{{ mapNodes }}\" as=\"n\" hint-placeholder-count=\"5\">\n            <div class=\"dc-mapcard\" style=\"position:absolute; left:{{ n.left }}%; top:{{ n.top }}%; transform:translate(-50%,-50%); width:164px; padding:12px; background:#fff; border:1px solid #DDE2DC; border-radius:8px; box-shadow:0 6px 18px -14px rgba(17,19,18,0.4);\">\n              <div style=\"width:18px; height:3px; background:{{ n.color }};\"><\u002Fdiv>\n              <p style=\"margin:10px 0 0; font-weight:900; color:#111312; font-size:14px;\">{{ n.title }}<\u002Fp>\n              <p style=\"margin:4px 0 0; font-size:12px; line-height:1.25; color:#626861;\">{{ n.caption }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:5 1 340px; min-width:300px; background:#fff; border:1px solid #DDE2DC; border-radius:8px; padding:20px;\">\n        <span style=\"color:#0F766E; font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:11px; font-weight:800;\">CAPABILITY LENS<\u002Fspan>\n        <div style=\"margin-top:16px; display:flex; flex-wrap:wrap; gap:8px;\">\n          <sc-for list=\"{{ capabilityTabs }}\" as=\"tab\" hint-placeholder-count=\"4\">\n            <button onclick=\"{{ tab.onClick }}\" class=\"cbtn\" style=\"padding:9px 12px; font-size:13px; font-weight:800; border-radius:8px; background:{{ tab.bg }}; color:{{ tab.fg }}; border:1px solid {{ tab.border }};\">{{ tab.name }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top:18px; animation:fadeUp .3s ease both;\" ref=\"{{ capRef }}\">\n          <p style=\"margin:0; font-size:16px; font-weight:700; line-height:1.4; color:#111312;\">{{ selectedSummary }}<\u002Fp>\n          <div style=\"margin-top:16px;\">\n            <sc-for list=\"{{ selectedItems }}\" as=\"it\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex; align-items:flex-start; gap:10px; margin-bottom:14px;\">\n                <span class=\"msi\" style=\"font-size:18px; color:#0F766E; margin-top:2px;\">check<\u002Fspan>\n                <div>\n                  <p style=\"margin:0; font-weight:800; color:#111312; font-size:14px;\">{{ it.title }}<\u002Fp>\n                  <p style=\"margin:4px 0 0; font-size:14px; line-height:1.45; color:#626861;\">{{ it.body }}<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- EXPERIENCE -->\n  <section id=\"sec-Experience\" data-screen-label=\"Experience\" style=\"margin-top:82px;\">\n    <div style=\"max-width:760px;\">\n      <span style=\"color:#0F766E; font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:11px; font-weight:800;\">EXPERIENCE<\u002Fspan>\n      <h2 style=\"margin:12px 0 0; font-size:clamp(30px,4vw,40px); font-weight:900; line-height:1.05; color:#111312;\">Founder range, engineer depth.<\u002Fh2>\n      <p style=\"margin:12px 0 0; font-size:16px; line-height:1.62; color:#626861;\">The page stays focused on current platform, AI, mobile, and infrastructure work. The downloadable resume carries the longer career history.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"margin-top:18px;\">\n      <sc-for list=\"{{ experience }}\" as=\"e\" hint-placeholder-count=\"5\">\n        <div style=\"display:flex; align-items:stretch; gap:0;\">\n          <div style=\"width:28px; display:flex; flex-direction:column; align-items:center;\">\n            <span style=\"width:12px; height:12px; border-radius:50%; background:#0F766E; flex:none;\"><\u002Fspan>\n            <span style=\"width:1px; flex:1; min-height:120px; background:#DDE2DC;\"><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1; margin-bottom:16px; background:#fff; border:1px solid #DDE2DC; border-radius:8px; padding:18px;\">\n            <div style=\"display:flex; flex-wrap:wrap; align-items:center; gap:12px;\">\n              <span style=\"flex:1 1 200px; font-size:16px; font-weight:900; color:#111312;\">{{ e.heading }}<\u002Fspan>\n              <span style=\"color:#0F766E; font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:11px; font-weight:800;\">{{ e.period }}<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"margin:6px 0 0; font-size:12.5px; font-weight:700; color:#626861;\">{{ e.place }}<\u002Fp>\n            <p style=\"margin:12px 0 0; font-size:14px; line-height:1.55; color:#626861;\">{{ e.summary }}<\u002Fp>\n            <div style=\"margin-top:13px; display:flex; flex-wrap:wrap; gap:8px;\">\n              <sc-for list=\"{{ e.tags }}\" as=\"t\" hint-placeholder-count=\"4\">\n                <span style=\"padding:7px 10px; background:#F1F4EF; border:1px solid #DDE2DC; border-radius:8px; font-size:12px; font-weight:700; color:#111312;\">{{ t }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- STACK -->\n  <section id=\"sec-Stack\" data-screen-label=\"Stack\" style=\"margin-top:82px;\">\n    <div style=\"max-width:760px;\">\n      <span style=\"color:#0F766E; font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:11px; font-weight:800;\">STACK<\u002Fspan>\n      <h2 style=\"margin:12px 0 0; font-size:clamp(30px,4vw,40px); font-weight:900; line-height:1.05; color:#111312;\">Tools chosen for shipping.<\u002Fh2>\n      <p style=\"margin:12px 0 0; font-size:16px; line-height:1.62; color:#626861;\">The skill set is broad, but the center of gravity is production systems: clear APIs, reliable workers, polished client surfaces, and observable deployments.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"dc-grid\" style=\"margin-top:24px; display:grid; grid-template-columns:repeat(4,1fr); gap:14px;\">\n      <sc-for list=\"{{ skillColumns }}\" as=\"col\" hint-placeholder-count=\"4\">\n        <div style=\"background:#fff; border:1px solid #DDE2DC; border-radius:8px; padding:18px;\">\n          <p style=\"margin:0; font-size:16px; font-weight:900; color:#111312;\">{{ col.title }}<\u002Fp>\n          <div style=\"margin-top:14px; display:flex; flex-wrap:wrap; gap:8px;\">\n            <sc-for list=\"{{ col.skills }}\" as=\"s\" hint-placeholder-count=\"6\">\n              <span style=\"padding:7px 10px; background:#F1F4EF; border:1px solid #DDE2DC; border-radius:8px; font-size:12px; font-weight:700; color:#111312;\">{{ s }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CONTACT -->\n  <section id=\"sec-Contact\" data-screen-label=\"Contact\" class=\"dc-stack\" style=\"margin-top:82px; display:flex; gap:28px; align-items:flex-start; flex-wrap:wrap;\">\n    <div style=\"flex:6 1 380px; min-width:300px;\">\n      <span style=\"color:#0F766E; font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:11px; font-weight:800;\">CONTACT<\u002Fspan>\n      <h2 style=\"margin:16px 0 0; font-size:clamp(26px,3.4vw,34px); font-weight:800; line-height:1.1; color:#111312;\">Need someone who can move from architecture to shipped product?<\u002Fh2>\n      <p style=\"margin:14px 0 0; font-size:18px; line-height:1.62; color:#626861;\">I am most useful where a product has real technical weight: compute orchestration, AI media pipelines, mobile surfaces, backend services, and the deployment machinery around them.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex:5 1 320px; min-width:300px; background:#fff; border:1px solid #DDE2DC; border-radius:8px; padding:20px;\">\n      <p style=\"margin:0; font-size:20px; font-weight:800; color:#111312;\">Start with context.<\u002Fp>\n      <p style=\"margin:10px 0 0; font-size:14px; line-height:1.55; color:#626861;\">Send the problem, constraints, and the decision you are trying to make. I will respond with a practical next step.<\u002Fp>\n      <div style=\"margin-top:18px; display:flex; flex-wrap:wrap; gap:10px;\">\n        <button onclick=\"{{ emailProject }}\" class=\"cbtn\" style=\"background:#111312; color:#fff; border:1px solid #111312; padding:15px 18px;\" style-hover=\"background:#000; transform:translateY(-1px); box-shadow:0 12px 26px -14px rgba(17,19,18,0.55);\"><span class=\"msi\" style=\"font-size:19px;\">mail<\u002Fspan>Email Aaryn<\u002Fbutton>\n        <button onclick=\"{{ downloadResume }}\" class=\"cbtn\" style=\"background:#fff; color:#111312; border:1px solid #111312; padding:15px 18px;\" style-hover=\"background:#F1F4EF;\"><span class=\"msi\" style=\"font-size:19px;\">download<\u002Fspan>Resume<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"height:1px; background:#DDE2DC; margin:18px 0;\"><\u002Fdiv>\n      <button onclick=\"{{ emailPlain }}\" class=\"cbtn\" style=\"width:100%; justify-content:flex-start; background:none; border:none; padding:8px 0; color:#111312;\" style-hover=\"opacity:.7;\"><span class=\"msi\" style=\"font-size:18px; color:#0F766E;\">alternate_email<\u002Fspan>aaryn.alexander@gmail.com<\u002Fbutton>\n      <button onclick=\"{{ openLinkedin }}\" class=\"cbtn\" style=\"width:100%; justify-content:flex-start; background:none; border:none; padding:8px 0; color:#111312;\" style-hover=\"opacity:.7;\"><span class=\"msi\" style=\"font-size:18px; color:#0F766E;\">north_east<\u002Fspan>linkedin.com/in/aabiro<\u002Fbutton>\n      <button onclick=\"{{ openGithub }}\" class=\"cbtn\" style=\"width:100%; justify-content:flex-start; background:none; border:none; padding:8px 0; color:#111312;\" style-hover=\"opacity:.7;\"><span class=\"msi\" style=\"font-size:18px; color:#0F766E;\">code<\u002Fspan>github.com/aabiro<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <footer style=\"margin-top:auto; padding-top:70px; border-top:1px solid #DDE2DC; text-align:center;\">\n    <p style=\"margin:0; font-size:12.5px; color:#626861;\">© {{ currentYear }} Aaryn Biro<\u002Fp>\n  <\u002Ffooter>\n\n<\u002Fmain>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:900},&quot;showBackdropGrid d production rollout practices.' },\n        { title:'Technical leadership', body:'Roadmapping, product judgment, customer discovery, mentoring, and converting ambiguity into shipped systems.' }] },\n  ];\n\n  experience = [\n    { role:'Founder and Principal Engineer', company:'Xcelsior', period:'2025 - Present', place:'London, ON / Remote',\n      summary:'Building a distributed compute platform for GPU workload orchestration, secure worker admission, scheduling, billing, Next.js interfaces, and developer tooling.',\n      tags:['Distributed systems','GPU compute','Secure workers','Next.js'] },\n    { role:'Founder and Principal Engineer', company:'PixelEnhance Labs', period:'Jan 2024 - Present', place:'London, ON / Remote',\n      summary:'Architected and delivered an AI media platform with backend services, async processing, orchestration, deployment automation, and observability.',\n      tags:['AI media','FastAPI','React','GPU workloads'] },\n    { role:'Software Developer', company:'Snappy Inc.', period:'Mar 2023 - Dec 2023', place:'Toronto, ON / Remote',\n      summary:'Delivered iOS and Android product features, including membership, rewards, sign-in, and verification workflows with reliable release iteration.',\n      tags:['Mobile product','iOS','Android','Release workflows'] },\n    { role:'Software Developer', company:'Neurolign Technologies Inc.', period:'Jun 2021 - Dec 2022', place:'Toronto, ON / Remote',\n      summary:'Built Flutter features, API integrations, monitoring, analytics, and frontend/backend functionality across Node.js, MongoDB, Express, and React.',\n      tags:['Flutter','Dart','APIs','Analytics'] },\n    { role:'Earlier full-stack SaaS engineering', company:'realxdata GmbH', period:'May 2018 - Sep 2019', place:'Berlin, Germany',\n      summary:'Built data-driven workflows, reporting capabilities, AWS integrations, third-party API integrations, automated tests, and CI quality loops.',\n      tags:['SaaS','Data workflows','AWS','CI quality'] },\n  ];\n\n  skillColumns = [\n    { title:'Backend and orchestration', skills:['Python','FastAPI','Node.js','PostgreSQL','Redis','MongoDB','REST APIs','background jobs','service-oriented architecture'] },\n    { title:'AI and media systems', skills:['PyTorch','TensorRT','FFmpeg','model benchmarking','inference pipelines','GPU orchestration','video enhancement'] },\n    { title:'Frontend and mobile', skills:['React','Next.js','TypeScript','SwiftUI','Flutter','Dart','Kotlin','responsive UX','release workflows'] },\n    { title:'Infrastructure and delivery', skills:['Docker','Linux','Nginx','AWS','Firebase','CI/CD','observability','cloud deployment'] },\n  ];\n\n  mapNodes = [\n    { title:'Public API', caption:'auth / contracts', x:16, y:22, color:'#0F766E' },\n    { title:'Scheduler', caption:'queues / routing', x:50, y:22, color:'#D85C46' },\n    { title:'GPU workers', caption:'containers / mesh', x:84, y:22, color:'#2F6F9F' },\n    { title:'Billing', caption:'events / usage', x:30, y:74, color:'#2F6F9F' },\n    { title:'Observability', caption:'logs / traces', x:68, y:74, color:'#0F766E' },\n  ];\n\n  heroTags = ['GPU orchestration','FastAPI / Next.js','Flutter / SwiftUI','Docker / Nginx','London, ON'];\n  navLabels = ['Work','GitHub','Systems','Experience','Stack','Contact'];\n\n  componentDidMount() {\n    this._setupBackdrop();\n    this._fetchGithub();\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('mousemove', this._onMove);\n    window.removeEventListener('scroll', this._onScroll, true);\n    window.removeEventListener('resize', this._resize);\n  }\n\n  _setupBackdrop() {\n    const c = this._bg;\n    if (!c) return;\n    const ctx = c.getContext('2d');\n    let cursor = null, scrollProg = 0;\n    const draw = () => {\n      const w = window.innerWidth, h = window.innerHeight;\n      ctx.clearRect(0, 0, w, h);\n      ctx.fillStyle = '#FAFAF8';\n      ctx.fillRect(0, 0, w, h);\n      if (this.props.showBackdropGrid !== false) {\n        ctx.strokeStyle = 'rgba(17,19,18,0.035)';\n        ctx.lineWidth = 1;\n        const step = 38;\n        const off = (scrollProg * 60) % step;\n        for (let x = -off; x < w; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }\n        for (let y = off; y < h; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }\n      }\n      ctx.strokeStyle = 'rgba(15,118,110,0.055)';\n      ctx.lineWidth = 44;\n      ctx.beginPath();\n      ctx.moveTo(w * 0.70, -80);\n      ctx.lineTo(w + 120, h * 0.35);\n      ctx.stroke();\n      if (cursor && this.props.enableCrosshair !== false) {\n        ctx.strokeStyle = 'rgba(15,118,110,0.075)';\n        ctx.lineWidth = 1;\n        ctx.beginPath(); ctx.moveTo(cursor.x, 0); ctx.lineTo(cursor.x, h); ctx.stroke();\n        ctx.beginPath(); ctx.moveTo(0, cursor.y); ctx.lineTo(w, cursor.y); ctx.stroke();\n      }\n    };\n    this._resize = () => {\n      const dpr = window.devicePixelRatio || 1;\n      c.width = window.innerWidth * dpr;\n      c.height = window.innerHeight * dpr;\n      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n      draw();\n    };\n    this._onMove = (e) => { cursor = { x: e.clientX, y: e.clientY }; draw(); };\n    this._onScroll = () => {\n      const el = document.scrollingElement || document.documentElement;\n      const max = el.scrollHeight - el.clientHeight;\n      scrollProg = max <= 0 ? 0 : Math.min(1, Math.max(0, el.scrollTop / max));\n      if (this._prog) this._prog.style.width = (scrollProg * 100) + '%';\n      if (this._topBtn) {\n        const show = scrollProg > 0.04;\n        this._topBtn.style.opacity = show ? '1' : '0';\n        this._topBtn.style.pointerEvents = show ? 'auto' : 'none';\n      }\n      draw();\n    };\n    window.addEventListener('resize', this._resize);\n    window.addEventListener('mousemove', this._onMove);\n    window.addEventListener('scroll', this._onScroll, true);\n    this._resize();\n    this._onScroll();\n  }\n\n  async _fetchGithub() {\n    const user = this.props.githubUsername || 'aabiro';\n    const since = new Date(2025, 3, 1);\n    try {\n      const now = new Date();\n      const years = [];\n      for (let y = since.getFullYear(); y <= now.getFullYear(); y++) years.push('y=' + y);\n      const res = await fetch('https://github-contributions-api.jogruber.de/v4/' + user + '?' + years.join('&'));\n      if (!res.ok) throw new Error('bad');\n      const data = await res.json();\n      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());\n      const days = [];\n      for (const e of data.contributions) {\n        const d = new Date(e.date + 'T00:00:00');\n        if (d < since || d > today) continue;\n        days.push({ date: d, count: e.count, level: Math.max(0, Math.min(4, e.level)) });\n      }\n      days.sort((a, b) => a.date - b.date);\n      const built = this._buildWeeks(days);\n      const total = days.reduce((s, d) => s + d.count, 0);\n      this.setState({ ...built, total, loading: false, failed: false });\n      requestAnimationFrame(() => { if (this._graph) this._graph.scrollLeft = this._graph.scrollWidth; });\n    } catch (_) {\n      this.setState({ loading: false, failed: this.state.total == null });\n    }\n  }\n\n  _buildWeeks(days) {\n    if (!days.length) return { weeks: [], monthLabels: [], gridWidth: 0 };\n    const leading = days[0].date.getDay();\n    const weeksRaw = [];\n    let wk = new Array(7).fill(null);\n    let slot = leading;\n    for (const day of days) {\n      wk[slot] = day; slot++;\n      if (slot === 7) { weeksRaw.push(wk); wk = new Array(7).fill(null); slot = 0; }\n    }\n    if (slot > 0) weeksRaw.push(wk);\n    const labels = [];\n    let lastMonth = null, lastLabelWeek = -10;\n    for (let w = 0; w < weeksRaw.length; w++) {\n      const fd = weeksRaw[w].find(d => d);\n      if (!fd) continue;\n      const m = fd.date.getMonth();\n      if (m !== lastMonth) {\n        if (w - lastLabelWeek >= 3) { labels.push({ left: w * 14, text: this.months[m] }); lastLabelWeek = w; }\n        lastMonth = m;\n      }\n    }\n    const weeks = weeksRaw.map(col => col.map(d => {\n      if (!d) return { empty: true, color: 'transparent', title: '' };\n      const label = d.count === 1 ? '1 contribution' : ((d.count === 0 ? 'No' : d.count) + ' contributions');\n      const wd = this.weekdayNames[d.date.getDay()];\n      return { empty: false, color: this.levelColors[d.level],\n        title: label + ' on ' + wd + ', ' + this.months[d.date.getMonth()] + ' ' + d.date.getDate() + ', ' + d.date.getFullYear() };\n    }));\n    return { weeks, monthLabels: labels, gridWidth: weeksRaw.length * 14 - 3 };\n  }\n\n  _scrollTo(label) {\n    const el = document.getElementById('sec-' + label);\n    if (!el) return;\n    const top = el.getBoundingClientRect().top + window.scrollY - 90;\n    window.scrollTo({ top, behavior: 'smooth' });\n  }\n\n  _open(url) { window.open(url, '_blank', 'noopener'); }\n  _email(subject) { window.open('mailto:aaryn.alexander@gmail.com?subject=' + encodeURIComponent(subject), '_self'); }\n  _isMobileBrowser() {\n    const ua = (navigator.userAgent || '').toLowerCase();\n    return /iphone|ipad|ipod|android/.test(ua);\n  }\n  _download() {\n    const href = (window.__resources && window.__resources.resumePdf) || 'assets/Aaryn_Biro_Resume.pdf';\n    const a = document.createElement('a');\n    a.href = href;\n    a.target = '_blank';\n    a.rel = 'noopener';\n    // Mobile browsers show their own PDF viewer (share, save, print controls)\n    // when a PDF is opened directly instead of forced through a download\n    // attribute, so skip `.download` on phones/tablets.\n    if (!this._isMobileBrowser()) a.download = 'Aaryn_Biro_Resume.pdf';\n    document.body.appendChild(a); a.click(); a.remove();\n  }\n\n  renderVals() {\n    const selected = this.capabilities.find(g => g.name === this.state.cap) || this.capabilities[0];\n    const sinceLabel = 'Apr 2025';\n    const githubTitle = this.state.total == null\n      ? 'Contributions since ' + sinceLabel\n      : this.state.total + ' contributions since ' + sinceLabel;\n    return {\n      metrics: this.metrics,\n      caseStudies: this.caseStudies,\n      experience: this.experience.map(e => ({ ...e, heading: e.role + ' / ' + e.company })),\n      skillColumns: this.skillColumns,\n      heroTags: this.heroTags,\n      mapNodes: this.mapNodes.map(n => ({ ...n, left: n.x, top: n.y })),\n      navItems: this.navLabels.map(l => ({ label: l, onClick: () => { this.setState({ mobileNavOpen: false }); this._scrollTo(l); } })),\n      capabilityTabs: this.capabilities.map(g => {\n        const sel = g.name === this.state.cap;\n        return { name: g.name, onClick: () => this.setState({ cap: g.name }),\n          bg: sel ? '#111312' : '#F1F4EF', fg: sel ? '#ffffff' : '#111312', border: sel ? '#111312' : '#DDE2DC' };\n      }),\n      selectedSummary: selected.summary,\n      selectedItems: selected.items,\n      weeks: this.state.weeks,\n      monthLabels: this.state.monthLabels,\n      gridWidth: this.state.gridWidth,\n      gridWidthPad: this.state.gridWidth + 30,\n      legendColors: this.levelColors,\n      weekdayGutter: [\n        { label:'', h:14 }, { label:'Mon', h:14 }, { label:'', h:14 },\n        { label:'Wed', h:14 }, { label:'', h:14 }, { label:'Fri', h:14 }, { label:'', h:11 },\n      ],\n      githubTitle,\n      githubLoading: this.state.loading,\n      githubFailed: this.state.failed && !this.state.loading,\n      githubReady: !this.state.loading && !this.state.failed,\n      retryGithub: () => { this.setState({ loading: true, failed: false }); this._fetchGithub(); },\n      toTop: () => window.scrollTo({ top: 0, behavior: 'smooth' }),\n      currentYear: new Date().getFullYear(),\n      mobileNavOpen: this.state.mobileNavOpen,\n      toggleMobileNav: () => this.setState({ mobileNavOpen: !this.state.mobileNavOpen }),\n      closeMobileNav: () => this.setState({ mobileNavOpen: false }),\n      downloadResume: () => this._download(),\n      emailBuilding: () => this._email('Building together'),\n      emailProject: () => this._email('Project conversation'),\n      emailPlain: () => this._email('Project conversation'),\n      openLinkedin: () => this._open('https://www.linkedin.com/in/aabiro/'),\n      openGithub: () => this._open('https://github.com/aabiro'),\n      bgRef: (el) => { this._bg = el; },\n      progRef: (el) => { this._prog = el; },\n      topBtnRef: (el) => { this._topBtn = el; },\n      graphRef: (el) => { this._graph = el; },\n      capRef: () => {},\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
